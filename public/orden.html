<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="referrer" content="no-referrer">
  <title>Tu compra · ecko</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" data-site-name>ecko</a>
      <nav class="site-nav"><a href="/">Cartelera</a></nav>
    </div>
  </header>

  <main class="container has-mark" style="max-width: 860px">
    <!-- Fondo: el contorno de "ecko" con ondas de eco que salen de las letras. -->
    <div class="bg-mark" aria-hidden="true">
      <svg viewBox="0 0 640 240" focusable="false">
        <defs>
          <linearGradient id="mark-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff4d8d"/>
            <stop offset="0.55" stop-color="#b35cff"/>
            <stop offset="1" stop-color="#6b7bff"/>
          </linearGradient>
        </defs>
        <text class="mark-echo" x="320" y="178" text-anchor="middle">ecko</text>
        <text class="mark-echo" x="320" y="178" text-anchor="middle">ecko</text>
        <text class="mark-echo" x="320" y="178" text-anchor="middle">ecko</text>
        <text class="mark-outline" x="320" y="178" text-anchor="middle">ecko</text>
      </svg>
    </div>
    <div id="content"><div class="skeleton" style="height: 320px"></div></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-site-name>ecko</span></span>
      <span>¿Problemas con tu compra? Escribile al organizador del evento.</span>
    </div>
  </footer>

  <script type="module" src="/js/orden.js"></script>
</body>
</html>
