<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizadores · Ticketera</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <a class="logo" href="/">Ticketera</a>
      <nav><a href="/">Cartelera</a></nav>
    </div>
  </header>

  <main class="container narrow">
    <h1>Organizadores</h1>
    <p class="muted">Ingresá para crear y administrar tus eventos.</p>

    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Ingresar</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false">Crear cuenta</button>
      </div>

      <form id="form">
        <div id="name-field" hidden>
          <label for="name">Nombre o productora</label>
          <input id="name" autocomplete="organization">
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required minlength="8" autocomplete="current-password">
        <button type="submit" id="submit">Ingresar</button>
        <p id="message" class="error" role="alert"></p>
      </form>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
