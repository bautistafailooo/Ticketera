<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizadores · Ticketera</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <a class="logo" href="/">Ticketera</a>
      <nav><a href="/">Cartelera</a></nav>
    </div>
  </header>

  <main class="container narrow">
    <h1>Organizadores</h1>
    <p class="muted">Ingresá para crear y administrar tus eventos.</p>

    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Ingresar</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false">Crear cuenta</button>
      </div>

      <form id="form">
        <div id="name-field" hidden>
          <label for="name">Nombre o productora</label>
          <input id="name" autocomplete="organization">
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required minlength="8" autocomplete="current-password">
        <button type="submit" id="submit">Ingresar</button>
        <p id="message" class="error" role="alert"></p>
      </form>
    </div>
  </main>

  <script type="module">
    import { api } from "/common.js";

    const next = new URLSearchParams(location.search).get("next");
    const target = next && next.startsWith("/") && !next.startsWith("//") ? next : "/panel.html";
    let mode = "login";

    // Si ya hay sesión, directo al panel.
    api("/auth/me").then(() => location.replace(target), () => {});

    const nameField = document.getElementById("name-field");
    const nameInput = document.getElementById("name");
    const password = document.getElementById("password");
    const submit = document.getElementById("submit");
    const message = document.getElementById("message");

    function setMode(newMode) {
      mode = newMode;
      document.getElementById("tab-login").setAttribute("aria-selected", mode === "login");
      document.getElementById("tab-register").setAttribute("aria-selected", mode === "register");
      nameField.hidden = mode === "login";
      nameInput.required = mode === "register";
      password.autocomplete = mode === "login" ? "current-password" : "new-password";
      submit.textContent = mode === "login" ? "Ingresar" : "Crear cuenta";
      message.textContent = "";
    }

    document.getElementById("tab-login").addEventListener("click", () => setMode("login"));
    document.getElementById("tab-register").addEventListener("click", () => setMode("register"));

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      submit.disabled = true;
      message.textContent = "";
      const body = { email: document.getElementById("email").value, password: password.value };
      if (mode === "register") body.name = nameInput.value;
      try {
        await api(`/auth/${mode}`, { method: "POST", body: JSON.stringify(body) });
        location.href = target;
      } catch (err) {
        message.textContent = err.message;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
