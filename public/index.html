<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="description" content="Entradas para recitales, fiestas, teatro y más.">
  <title>ecko · Entradas para eventos</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" data-site-name>ecko</a>
      <nav class="site-nav"><a class="nav-cta" href="/login.html" data-account-link>Vendé entradas</a></nav>
    </div>
  </header>

  <section class="featured" id="featured" aria-roledescription="carrusel" aria-label="Próximos eventos" hidden>
    <div class="featured-track"></div>
    <button type="button" class="featured-nav prev" aria-label="Anterior"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" class="featured-nav next" aria-label="Siguiente"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="featured-dots"></div>
  </section>

  <section class="hero">
    <canvas class="echo-canvas" id="echo" aria-hidden="true"></canvas>
    <div class="container">
      <h1>Tu próxima <span>noche</span> empieza acá.</h1>
      <p id="tagline"></p>
      <div class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscá por artista, evento o lugar" aria-label="Buscar eventos" autocomplete="off">
      </div>
    </div>
  </section>

  <div class="marquee" aria-hidden="true" hidden><div class="marquee-track" id="marquee"></div></div>

  <main class="container has-mark">
    <!-- Fondo: dos luces suaves que se mueven despacio detrás de las entradas. -->
    <div class="bg-lights" aria-hidden="true"><span></span><span></span></div>
    <div class="section-head">
      <h2>Próximos eventos</h2>
      <span class="muted small" id="count"></span>
    </div>
    <div id="events" class="event-grid" aria-live="polite">
      <div class="skeleton" style="aspect-ratio: 4 / 6"></div>
      <div class="skeleton" style="aspect-ratio: 4 / 6"></div>
      <div class="skeleton" style="aspect-ratio: 4 / 6"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-site-name>ecko</span></span>
      <span>¿Organizás eventos? <a href="/panel.html">Vendé tus entradas acá</a></span>
      <nav class="legal-links" aria-label="Legales">
        <a href="/terminos.html">Términos y condiciones</a>
        <a href="/privacidad.html">Privacidad</a>
        <a href="/devoluciones.html">Devoluciones</a>
        <a href="/arrepentimiento.html" class="revocation-link">Botón de arrepentimiento</a>
        <a data-contact-email>Contacto</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="/js/index.js"></script>
</body>
</html>
