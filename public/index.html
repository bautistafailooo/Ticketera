<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="description" content="Entradas para recitales, fiestas, teatro y más.">
  <title>ecko · Entradas para eventos</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" data-site-name>ecko</a>
      <nav class="site-nav"><a href="/panel.html">Organizadores</a></nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Tu próxima <span>noche</span> empieza acá.</h1>
      <p id="tagline"></p>
      <div class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscá por artista, evento o lugar" aria-label="Buscar eventos" autocomplete="off">
      </div>
    </div>
  </section>

  <main class="container">
    <div class="section-head">
      <h2>Próximos eventos</h2>
      <span class="muted small" id="count"></span>
    </div>
    <div id="events" class="event-grid" aria-live="polite">
      <div class="skeleton" style="aspect-ratio: 4 / 6"></div>
      <div class="skeleton" style="aspect-ratio: 4 / 6"></div>
      <div class="skeleton" style="aspect-ratio: 4 / 6"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-site-name>ecko</span></span>
      <span>¿Organizás eventos? <a href="/panel.html">Vendé tus entradas acá</a></span>
    </div>
  </footer>

  <script type="module" src="/js/index.js"></script>
</body>
</html>
