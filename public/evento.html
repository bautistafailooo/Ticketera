<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evento · Ticketera</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="container"><a class="logo" href="/">Ticketera</a></div>
  </header>

  <main class="container">
    <a class="back" href="/">← Volver a la cartelera</a>
    <div id="content"><p class="muted">Cargando…</p></div>
  </main>

  <script type="module">
    import { api, escapeHtml, formatDate, formatPrice } from "/common.js";

    const content = document.getElementById("content");
    const eventId = new URLSearchParams(location.search).get("id");

    function renderEvent(event) {
      document.title = `${event.name} · Ticketera`;
      const ticketTypes = event.ticketTypes.map((t) => {
        const available = t.capacity - t.sold;
        const max = Math.min(10, available);
        const options = Array.from({ length: max + 1 }, (_, n) => `<option value="${n}">${n}</option>`).join("");
        return `
          <div class="ticket-type">
            <div>
              <strong>${escapeHtml(t.name)}</strong>
              <div class="price">${formatPrice(t.priceCents)}</div>
              <div class="muted">${available > 0 ? `${available} disponibles` : "Agotado"}</div>
            </div>
            ${available > 0 ? `
              <select data-id="${t.id}" data-price="${t.priceCents}" aria-label="Cantidad de ${escapeHtml(t.name)}">
                ${options}
              </select>` : ""}
          </div>`;
      }).join("");

      content.innerHTML = `
        <div class="date">${escapeHtml(formatDate(event.startsAt))}</div>
        <h1>${escapeHtml(event.name)}</h1>
        <div class="muted">${escapeHtml(event.venue)}</div>
        ${event.description ? `<p>${escapeHtml(event.description)}</p>` : ""}

        <div class="layout">
          <section class="card">
            <h2>Entradas</h2>
            ${ticketTypes}
          </section>

          <form class="card" id="checkout">
            <h2>Tus datos</h2>
            <label for="name">Nombre y apellido</label>
            <input id="name" required autocomplete="name">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email">
            <div class="total"><span>Total</span><span id="total">${formatPrice(0)}</span></div>
            <button type="submit">Comprar</button>
            <p id="message" role="alert"></p>
          </form>
        </div>`;

      const selects = [...content.querySelectorAll("select")];
      const totalEl = document.getElementById("total");
      const message = document.getElementById("message");

      const selectedItems = () => selects
        .map((s) => ({ ticketTypeId: s.dataset.id, quantity: Number(s.value), priceCents: Number(s.dataset.price) }))
        .filter((item) => item.quantity > 0);

      selects.forEach((s) => s.addEventListener("change", () => {
        const total = selectedItems().reduce((sum, i) => sum + i.quantity * i.priceCents, 0);
        totalEl.textContent = formatPrice(total);
      }));

      document.getElementById("checkout").addEventListener("submit", async (e) => {
        e.preventDefault();
        const items = selectedItems().map(({ ticketTypeId, quantity }) => ({ ticketTypeId, quantity }));
        if (items.length === 0) {
          message.className = "error";
          message.textContent = "Elegí al menos una entrada.";
          return;
        }

        const button = e.submitter;
        button.disabled = true;
        button.textContent = "Procesando…";
        message.textContent = "";
        try {
          const order = await api("/orders", {
            method: "POST",
            body: JSON.stringify({
              buyerName: document.getElementById("name").value,
              buyerEmail: document.getElementById("email").value,
              items,
            }),
          });
          // Pago simulado: se reemplazará por la integración con el proveedor de pagos.
          const paid = await api(`/orders/${order.id}/pay`, { method: "POST" });
          renderTickets(event, paid);
        } catch (err) {
          message.className = "error";
          message.textContent = err.message;
          button.disabled = false;
          button.textContent = "Comprar";
        }
      });
    }

    function renderTickets(event, order) {
      const typeNames = Object.fromEntries(event.ticketTypes.map((t) => [t.id, t.name]));
      content.innerHTML = `
        <p class="success">¡Compra confirmada!</p>
        <h1>${escapeHtml(event.name)}</h1>
        <p class="muted">${escapeHtml(formatDate(event.startsAt))} · ${escapeHtml(event.venue)}</p>
        <p>Orden <span class="code">${escapeHtml(order.id)}</span> · Total ${formatPrice(order.totalCents)}</p>
        <p class="muted">Mostrá el QR de cada entrada en la puerta.</p>
        <div class="tickets">
          ${order.tickets.map((ticket) => `
            <div class="card ticket">
              <strong>${escapeHtml(typeNames[ticket.ticketTypeId] ?? "Entrada")}</strong>
              <div class="qr"><img src="/tickets/${encodeURIComponent(ticket.code)}/qr.svg" alt="Código QR de la entrada"></div>
              <div class="code">${escapeHtml(ticket.code)}</div>
            </div>`).join("")}
        </div>`;
    }

    try {
      if (!eventId) throw new Error("No se indicó el evento.");
      renderEvent(await api(`/events/${encodeURIComponent(eventId)}`));
    } catch (err) {
      content.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
    }
  </script>
</body>
</html>
