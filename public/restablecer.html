<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <title>Contraseña nueva · ecko</title>
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/favicon.svg">
  <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" data-site-name>ecko</a>
      <nav class="site-nav"><a href="/">Cartelera</a></nav>
    </div>
  </header>

  <main class="container">
    <div class="auth">
      <h1 style="text-align: center">Contraseña nueva</h1>
      <p class="muted" style="text-align: center">Elegí una contraseña nueva para tu cuenta de organizador.</p>

      <div class="card">
        <form id="form">
          <label for="password">Contraseña nueva</label>
          <input id="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password">
          <p class="field-hint">Al menos 8 caracteres.</p>
          <label for="confirm">Repetila</label>
          <input id="confirm" type="password" required minlength="8" maxlength="200" autocomplete="new-password">
          <button type="submit" id="submit" class="btn btn-gradient btn-block" style="margin-top: 24px">Guardar y entrar</button>
          <p id="message" class="error" role="alert" style="margin: 12px 0 0"></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-site-name>ecko</span></span>
      <a href="/">Ver la cartelera</a>
    </div>
  </footer>

  <script type="module" src="/js/restablecer.js"></script>
</body>
</html>
