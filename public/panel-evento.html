<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <title>Evento · Panel · ecko</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" data-site-name>ecko</a>
      <nav class="site-nav" aria-label="Panel">
        <a href="/panel.html" data-section="panel">Mis eventos</a>
        <a href="/admin.html" id="admin-link" data-section="admin" hidden><span class="only-wide">Administración</span><span class="only-narrow">Admin</span></a>
        <div class="account">
          <button type="button" class="account-button" id="account-button" aria-expanded="false" aria-controls="account-menu" aria-label="Tu cuenta">
            <span class="avatar" id="user-initial" aria-hidden="true"></span>
            <span class="user-name" id="user-name"></span>
          </button>
          <div class="account-menu" id="account-menu" hidden>
            <div class="account-info"><strong id="menu-name"></strong><span id="menu-email"></span></div>
            <a href="/panel.html#perfil" id="menu-profile">Mi página pública</a>
            <a href="/">Ver la cartelera</a>
            <button type="button" id="logout">Cerrar sesión</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="notice" id="account-notice" hidden></p>
    <div id="content"><div class="skeleton" style="height: 320px"></div></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-site-name>ecko</span></span>
      <a href="/">Ver la cartelera</a>
      <nav class="legal-links" aria-label="Legales">
        <a href="/terminos.html">Términos y condiciones</a>
        <a href="/privacidad.html">Privacidad</a>
        <a href="/devoluciones.html">Devoluciones</a>
        <a href="/arrepentimiento.html" class="revocation-link">Botón de arrepentimiento</a>
        <a data-contact-email>Contacto</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="/js/panel-evento.js"></script>
</body>
</html>
