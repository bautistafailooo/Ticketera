<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <title>Mis eventos · ecko</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" data-site-name>ecko</a>
      <nav class="site-nav" aria-label="Panel">
        <a href="/panel.html" data-section="panel">Mis eventos</a>
        <a href="/admin.html" id="admin-link" data-section="admin" hidden><span class="only-wide">Administración</span><span class="only-narrow">Admin</span></a>
        <div class="account">
          <button type="button" class="account-button" id="account-button" aria-expanded="false" aria-controls="account-menu" aria-label="Tu cuenta">
            <span class="avatar" id="user-initial" aria-hidden="true"></span>
            <span class="user-name" id="user-name"></span>
          </button>
          <div class="account-menu" id="account-menu" hidden>
            <div class="account-info"><strong id="menu-name"></strong><span id="menu-email"></span></div>
            <a href="/">Ver la cartelera</a>
            <button type="button" id="logout">Cerrar sesión</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="notice" id="account-notice" hidden></p>
    <div class="page-head">
      <div>
        <p class="muted" style="margin: 0 0 4px">Panel del organizador</p>
        <h1>Mis eventos</h1>
      </div>
      <button type="button" class="btn btn-gradient" id="toggle-new">+ Nuevo evento</button>
    </div>

    <section class="card mp-card" id="mercadopago" hidden style="margin-bottom: 24px"></section>

    <form class="card" id="new-event" hidden style="margin-bottom: 24px">
      <h2>Nuevo evento</h2>
      <p class="muted small">Después vas a poder agregar el flyer y los tipos de entrada.</p>
      <label for="name">Nombre</label>
      <input id="name" required maxlength="120" placeholder="Ej: Noche de Rock Nacional">
      <label for="description">Descripción</label>
      <textarea id="description" maxlength="2000" placeholder="Contá de qué se trata, quiénes tocan, horarios, edad mínima…"></textarea>
      <div class="form-row">
        <div>
          <label for="venue">Lugar</label>
          <input id="venue" required maxlength="200" placeholder="Ej: Estadio Obras">
        </div>
        <div>
          <label for="startsAt">Fecha y hora</label>
          <input id="startsAt" type="datetime-local" required>
        </div>
      </div>
      <label for="address">Dirección <span class="faint">(opcional)</span></label>
      <input id="address" maxlength="200" placeholder="Ej: Av. del Libertador 7395, CABA">
      <p class="field-hint">Con la dirección, la página del evento muestra un mapa y el botón "Cómo llegar".</p>
      <div class="form-actions">
        <button type="submit" class="btn">Crear evento</button>
        <button type="button" class="btn btn-secondary" id="cancel-new">Cancelar</button>
      </div>
      <p id="new-message" class="error" role="alert" style="margin: 12px 0 0"></p>
    </form>

    <div id="events" class="panel-grid">
      <div class="skeleton" style="height: 150px"></div>
      <div class="skeleton" style="height: 150px"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-site-name>ecko</span></span>
      <a href="/">Ver la cartelera</a>
    </div>
  </footer>

  <script type="module" src="/js/panel.js"></script>
</body>
</html>
