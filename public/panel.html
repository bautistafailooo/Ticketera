<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis eventos · Ticketera</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <a class="logo" href="/">Ticketera</a>
      <nav>
        <a href="/panel.html">Mis eventos</a>
        <a href="/admin.html" id="admin-link" hidden>Administración</a>
        <span class="muted" id="user-name"></span>
        <button type="button" class="link-button" id="logout">Salir</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="notice" id="pending-notice" hidden>
      Tu cuenta está pendiente de aprobación. Ya podés preparar tus eventos; vas a poder publicarlos cuando un administrador la apruebe.
    </p>
    <div class="page-head">
      <h1>Mis eventos</h1>
      <button type="button" id="toggle-new">Nuevo evento</button>
    </div>

    <form class="card" id="new-event" hidden>
      <h2>Nuevo evento</h2>
      <label for="name">Nombre</label>
      <input id="name" required maxlength="120">
      <label for="description">Descripción</label>
      <input id="description" maxlength="2000">
      <div class="form-row">
        <div>
          <label for="venue">Lugar</label>
          <input id="venue" required maxlength="200">
        </div>
        <div>
          <label for="startsAt">Fecha y hora</label>
          <input id="startsAt" type="datetime-local" required>
        </div>
      </div>
      <button type="submit">Crear evento</button>
      <p id="new-message" class="error" role="alert"></p>
    </form>

    <div id="events" class="grid"><p class="muted">Cargando…</p></div>
  </main>

  <script type="module" src="/js/panel.js"></script>
</body>
</html>
