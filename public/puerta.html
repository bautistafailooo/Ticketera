<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puerta · Ticketera</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/jsQR.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <a class="logo" href="/">Ticketera</a>
      <nav><span class="muted">Puerta</span></nav>
    </div>
  </header>

  <main class="container door">
    <div id="no-access" hidden>
      <h1>Control de acceso</h1>
      <p class="muted">Abrí el link de puerta que te pasó el organizador del evento.</p>
      <p id="access-error" class="error" role="alert"></p>
    </div>

    <div id="app" hidden>
      <div class="date" id="event-date"></div>
      <h1 id="event-name"></h1>
      <div class="muted" id="event-venue"></div>

      <div class="card" style="margin-top: 16px">
        <div class="counter"><span id="checked-in">0</span> / <span id="paid">0</span></div>
        <div class="muted">ingresaron / entradas pagas</div>
      </div>

      <div id="result" class="result idle" role="status" aria-live="assertive">
        <div class="title">Listo para validar</div>
        <div>Escaneá un QR o cargá el código a mano.</div>
      </div>

      <button type="button" id="toggle-camera" class="button-secondary">Escanear con la cámara</button>
      <video id="video" playsinline muted hidden></video>
      <p id="camera-message" class="muted" role="alert"></p>

      <form class="manual" id="manual">
        <input id="code" placeholder="Ej: K7QM-4XTP-9HWD" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Código de la entrada">
        <button type="submit">Validar</button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/puerta.js"></script>
</body>
</html>
