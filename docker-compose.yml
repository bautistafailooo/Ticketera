# ecko en un servidor propio: la app detrás de Caddy, que pone el https automático.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./data:/data
    # Una sola instancia: la base SQLite y los límites de pedidos viven acá.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en el archivo .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
